name: ci
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy MkDocs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        name: Setup uv
        with:
          enable-cache: true

      # Installs the Python version pinned in .python-version, and the exact
      # package versions from uv.lock. Fails if uv.lock is out of date.
      - run: uv sync --locked

      - name: Deploy 
        run: uv run mkdocs gh-deploy --force --config-file production.yml
